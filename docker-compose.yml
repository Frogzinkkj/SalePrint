services:
  postgres:
    image: postgres:16-alpine
    container_name: gerenciador-postgres
    environment:
      POSTGRES_DB: gerenciador_impressoras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gerenciador_impressoras"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gerenciador-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Descomente após compilar o backend (mvn package) e subir o Docker daemon:
  # backend:
  #   build: ./backend
  #   container_name: gerenciador-backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gerenciador_impressoras
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  postgres_data:
